
<!DOCTYPE html>

    <meta charset="UTF-8">

    <link rel="stylesheet" href="styles.css">
    <title>Monarch | Timeline</title>

    <style>
        /* Universal setup */
        * {
            box-sizing: border-box;
        }
        body {
            
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 0;
        }

        /* Main timeline container wrapper */
        .timeline {
            position: relative;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* The vertical backbone line in the middle */
        .timeline::after {
            content: '';
            position: absolute;
            width: 6px;
            background: rgba(255, 255, 255, 0.65);
            top: 0;
            bottom: 0;
            left: 50%;
            margin-left: -3px;
        }

        /* Individual event containers (each takes half space) */
        .container {
            padding: 10px 40px;
            position: relative;
            width: 50%;
        }

        /* Small circular timeline indicators on the center line */
        .container::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            right: -10px;
            border: 4px solid #e74c3c;
            background: rgba(255, 255, 255, 0.9);
            top: 15px;
            border-radius: 50%;
            z-index: 1;
        }

        /* Push left containers to the left half */
        .left {
            left: 0;
        }

        /* Push right containers to the right half */
        .right {
            left: 50%;
        }

        /* Adjust the dot position for right-aligned items */
        .right::after {
            left: -10px;
        }

        /* Actual card styling holding the content */
        .content {
            padding: 20px 30px;
            position: relative;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    
        .content h2 {
            margin-top: 0;
            color: #e74c3c;
            font-size: 1.2rem;
        }
    
        .content p {
            margin-bottom: 0;
            color: #555;
            line-height: 1.5;
            }

            /* Responsive adjustments for screens under 600px wide */
            @media screen and (max-width: 600px) {
            /* Shift the backbone line to the left side */
            .timeline::after {
                left: 31px;
            }

            /* Force all items to take full width */
            .container {
                width: 100%;
                padding-left: 70px;
                padding-right: 25px;
            }

            /* Ensure all items behave as if they are on the right side */
            .right {
                left: 0%;
            }
      
            /* Shift all circular dots to align with the new left backbone line position */
            .container::after {
                left: 21px;
            }
        }
    </style>
</head>
