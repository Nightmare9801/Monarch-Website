
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monarch | Home</title>
</head>

<body style="
    margin: 0;
    min-height: 100vh;
    font-family: sans-serif;
    background-color: white;
    background-image: url('images.jpg');
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
    background-attachment: fixed;
">

    <!-- SIDEBAR -->
    <nav id="sidebar" style="
        position: fixed;
        top: 0;
        left: 0;
        width: 240px;
        height: 100vh;
        box-sizing: border-box;
        background: rgba(255, 255, 255, 0.13);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 25px 12px;
        box-shadow: 4px 0 30px rgba(0, 0, 0, 0.05);
        transition: width 0.3s ease;
        overflow-x: hidden;
    ">

        <!-- Toggle Button -->
        <button
            id="toggleButton"
            onclick="toggleSidebar()"
            aria-label="Collapse sidebar"
            style="
                align-self: flex-end;
                border: none;
                background: rgba(9, 32, 75, 0.08);
                color: rgba(9, 32, 75, 0.99);
                font-size: 20px;
                cursor: pointer;
                border-radius: 8px;
                padding: 7px 12px;
                margin-bottom: 25px;
            "
        >
            ☰
        </button>

        <!-- Logo and Name -->
        <div style="
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
            width: 100%;
        ">

            <img
                src="logo.webp"
                alt="Monarch Logo"
                style="
                    width: 42px;
                    height: 42px;
                    border-radius: 50%;
                    object-fit: cover;
                    flex-shrink: 0;
                "
            >

            <span class="sidebar-label" style="
                font-size: 20px;
                font-weight: bold;
                letter-spacing: 2px;
                color: rgba(9, 32, 75, 0.99);
                white-space: nowrap;
            ">
                MONARCH
            </span>

        </div>

        <!-- Navigation Links -->
        <div style="
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        ">

            <!-- Home: Active Page -->
            <a
                href="home.html"
                title="Home"
                aria-current="page"
                style="
                    text-decoration: none;
                    color: rgba(9, 32, 75, 0.99);
                    font-weight: bold;
                    padding: 14px 15px;
                    border-radius: 8px;
                    display: flex;
                    align-items: center;
                    gap: 15px;
                    background: rgba(9, 32, 75, 0.13);
                    border-left: 4px solid rgba(9, 32, 75, 0.85);
                    box-sizing: border-box;
                    transition: background 0.3s;
                "
            >
                <span style="font-size: 21px; min-width: 25px; text-align: center;">⌂</span>
                <span class="sidebar-label">Home</span>
            </a>

            <!-- About -->
            <a
                href="about.html"
                title="About"
                style="
                    text-decoration: none;
                    color: rgba(9, 32, 75, 0.99);
                    font-weight: bold;
                    padding: 14px 15px;
                    border-radius: 8px;
                    display: flex;
                    align-items: center;
                    gap: 15px;
                    box-sizing: border-box;
                    transition: background 0.3s;
                "
                onmouseover="this.style.background='rgba(9, 32, 75, 0.08)'"
                onmouseout="this.style.background='none'"
            >
                <span style="font-size: 21px; min-width: 25px; text-align: center;">ⓘ</span>
                <span class="sidebar-label">About</span>
            </a>

            <!-- Members -->
            <a
                href="members.html"
                title="Members"
                style="
                    text-decoration: none;
                    color: rgba(9, 32, 75, 0.99);
                    font-weight: bold;
                    padding: 14px 15px;
                    border-radius: 8px;
                    display: flex;
                    align-items: center;
                    gap: 15px;
                    box-sizing: border-box;
                    transition: background 0.3s;
                "
                onmouseover="this.style.background='rgba(9, 32, 75, 0.08)'"
                onmouseout="this.style.background='none'"
            >
                <span style="font-size: 21px; min-width: 25px; text-align: center;">♟</span>
                <span class="sidebar-label">Members</span>
            </a>

            <!-- Achievements -->
            <a
                href="achievements.html"
                title="Achievements"
                style="
                    text-decoration: none;
                    color: rgba(9, 32, 75, 0.99);
                    font-weight: bold;
                    padding: 14px 15px;
                    border-radius: 8px;
                    display: flex;
                    align-items: center;
                    gap: 15px;
                    box-sizing: border-box;
                    transition: background 0.3s;
                "
                onmouseover="this.style.background='rgba(9, 32, 75, 0.08)'"
                onmouseout="this.style.background='none'"
            >
                <span style="font-size: 21px; min-width: 25px; text-align: center;">🏆</span>
                <span class="sidebar-label">Achievements</span>
            </a>

            <a href="timeline.html" title="Timeline" style="text-decoration:none; color:rgba(9,32,75,0.99); font-weight:bold; padding:14px 15px; border-radius:8px; display:flex; align-items:center; gap:15px; box-sizing:border-box; transition:background 0.3s;" onmouseover="this.style.background='rgba(9,32,75,0.08)'" onmouseout="this.style.background='none'">
                <span style="font-size:21px; min-width:25px; text-align:center;">✉</span>
                <span class="sidebar-label">Timeline</span>
            </a>

            <!-- Join Us -->
            <a
                href="JoinUs.html"
                title="Join Us"
                style="
                    text-decoration: none;
                    color: rgba(9, 32, 75, 0.99);
                    font-weight: bold;
                    padding: 14px 15px;
                    border-radius: 8px;
                    display: flex;
                    align-items: center;
                    gap: 15px;
                    box-sizing: border-box;
                    transition: background 0.3s;
                "
                onmouseover="this.style.background='rgba(9, 32, 75, 0.08)'"
                onmouseout="this.style.background='none'"
            >
                <span style="font-size: 21px; min-width: 25px; text-align: center;">✉</span>
                <span class="sidebar-label">Join Us</span>
            </a>

        </div>
    </nav>


    <!-- MAIN CONTENT -->
    <main id="mainContent" style="
        margin-left: 240px;
        min-height: 100vh;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px;
        transition: margin-left 0.3s ease;
    ">

        <!-- Welcome Card -->
        <div style="
            width: 300px;
            max-width: 100%;
            padding: 25px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            color: white;
        ">

            <h2 style="
                margin-top: 0;
                color: black;
                text-align: center;
            ">
                Monarch
            </h2>

            <p style="
                margin: 0;
                line-height: 1.5;
                color: black;
                text-align: center;
            ">
                Welcome to the official team page of Monarch.
            </p>

            <p style="
                margin: 12px 0 0 0;
                line-height: 1.5;
                color: #98FB98;
                text-align: center;
            ">
                Long live the Ñ
            </p>

        </div>

    </main>


    <!-- SIDEBAR COLLAPSE SCRIPT -->
    <script>

        let sidebarCollapsed = false;

        function toggleSidebar() {

            const sidebar = document.getElementById("sidebar");
            const main = document.getElementById("mainContent");
            const labels = document.querySelectorAll(".sidebar-label");
            const links = document.querySelectorAll("#sidebar a");
            const button = document.getElementById("toggleButton");

            sidebarCollapsed = !sidebarCollapsed;

            if (sidebarCollapsed) {

                sidebar.style.width = "80px";
                sidebar.style.padding = "25px 10px";

                main.style.marginLeft = "80px";

                labels.forEach(label => {
                    label.style.display = "none";
                });

                links.forEach(link => {
                    link.style.justifyContent = "center";
                    link.style.padding = "14px 5px";
                    link.style.borderLeftWidth =
                        link.hasAttribute("aria-current") ? "4px" : "0px";
                });

                button.style.alignSelf = "center";
                button.setAttribute("aria-label", "Expand sidebar");

            } else {

                sidebar.style.width = "240px";
                sidebar.style.padding = "25px 12px";

                main.style.marginLeft = "240px";

                labels.forEach(label => {
                    label.style.display = "inline";
                });

                links.forEach(link => {
                    link.style.justifyContent = "flex-start";
                    link.style.padding = "14px 15px";
                    link.style.borderLeftWidth =
                        link.hasAttribute("aria-current") ? "4px" : "0px";
                });

                button.style.alignSelf = "flex-end";
                button.setAttribute("aria-label", "Collapse sidebar");

            }

        }

    </script>

</body>
</html>
